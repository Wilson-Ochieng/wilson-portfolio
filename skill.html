<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILLS</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <style>
        body{
            font-family: system-ui, Segoe UI, Roboto, Arial;
            background: linear-gradient(to right, #e0f7fa, #ffffff);
            padding-top: 2rem;
        }
        .skills-container {
            max-width: 720px;
            margin: 0 auto;
        }
        .professional-skills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 0;
            margin: 0;
            list-style: none;
        }
        .technical-skills {
            list-style: upper-roman;
        }
        .professional-skills li {
            background: #0ea5a4;
            color: #fff;
            padding: 8px 12px;
            border-radius: 999px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(14, 165, 164, 0.15);
            transition: transform .12s ease, box-shadow .12s ease;
        }
        .professional-skills li:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 18px rgba(14, 165, 164, 0.18);
        }
    </style>
    <div class="skills-container">
        <h1 class="mb-4">Skills Review</h1>
        <section class="mb-5">
            <h2>Technical Skills</h2>
            <ul class="technical-skills">
                <li>HTML & CSS</li>
                <li>JavaScript</li>
                <li>React</li>
                <li>Node.js</li>
                <li>Next.js</li>
            </ul>
        </section>
        <section class="mb-5">
            <h2>Professional Skills</h2>
            <ul class="professional-skills">
                <li>Problem Solving</li>
                <li>Team Collaboration</li>
                <li>Project Management</li>
                <li>Communication</li>
            </ul>
        </section>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
