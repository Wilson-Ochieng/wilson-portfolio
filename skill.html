<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Skills</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- AOS Animation -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --text: #1e293b;
            --bg: #f0f9ff;
            --card-bg: rgba(255, 255, 255, 0.85);
            --border: rgba(14, 165, 233, 0.2);
        }

        [data-theme="dark"] {
            --text: #e2e8f0;
            --bg: #0f172a;
            --card-bg: rgba(15, 23, 42, 0.7);
            --border: rgba(14, 165, 233, 0.3);
            --primary: #38bdf8;
        }

        * { transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        .navbar {
            backdrop-filter: blur(12px);
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-link {
            font-weight: 500;
            color: var(--text) !important;
            margin: 0 1rem;
            position: relative;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -6px;
            left: 50%;
            background: var(--primary);
            transition: all 0.3s ease;
            transform: translateX(-50%);
        }

        .nav-link:hover::after {
            width: 80%;
        }

        /* Dark Mode Toggle */
        .theme-toggle {
            background: none;
            border: none;
            font-size: 1.4rem;
            color: var(--text);
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            background: rgba(14, 165, 233, 0.2);
            transform: scale(1.1);
        }

        /* Background Floating Circles */
        .bg-circles {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden;
            z-index: -1;
            pointer-events: none;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(14, 165, 233, 0.1);
            animation: float 25s infinite linear;
        }

        [data-theme="dark"] .circle {
            background: rgba(56, 189, 248, 0.1);
        }

        .circle:nth-child(1) { width: 300px; height: 300px; top: 10%; left: 10%; animation-duration: 30s; }
        .circle:nth-child(2) { width: 200px; height: 200px; top: 60%; right: 15%; animation-duration: 35s; }
        .circle:nth-child(3) { width: 400px; height: 400px; bottom: 10%; left: 20%; animation-duration: 40s; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        .container { margin-top: 100px; padding: 4rem 1rem; max-width: 900px; }

        h1 {
            font-weight: 700;
            font-size: 3rem;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 2rem;
            color: var(--text);
        }

        /* Progress Bars */
        .progress {
            height: 12px;
            border-radius: 10px;
            background: rgba(148, 163, 184, 0.3);
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
        }

        .progress-bar {
            border-radius: 10px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            width: 0 !important;
            transition: width 2s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 3s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Professional Skills */
        .professional-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            list-style: none;
            padding: 0;
        }

        .professional-skills li {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            color: var(--primary-dark);
            padding: 14px 24px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
        }

        [data-theme="dark"] .professional-skills li {
            color: #38bdf8;
        }

        .professional-skills li:hover {
            transform: translateY(-10px) scale(1.08);
            background: var(--primary);
            color: white !important;
            box-shadow: 0 15px 35px rgba(14, 165, 233, 0.4);
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .navbar-nav { text-align: center; }
        }
    </style>
</head>
<body data-theme="light">

    <!-- Floating Background -->
    <div class="bg-circles">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#">MyPortfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="#home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="#about">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                    <li class="nav-item ms-3">
                        <button class="theme-toggle" id="themeToggle" aria-label="Toggle Dark Mode">
                            <i class="fas fa-moon"></i>
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" id="home">
        <h1 data-aos="fade-down">My Skills</h1>

        <!-- Technical Skills -->
        <section id="skills" data-aos="fade-up" data-aos-delay="200">
            <h2 class="section-title">Technical Skills</h2>
            <div class="row">
                <div class="col-lg-9 mx-auto">
                    <div class="skill-item" data-aos="fade-right" data-aos-delay="300">
                        <div class="skill-name">HTML & CSS</div>
                        <div class="progress"><div class="progress-bar" data-width="95"></div></div>
                    </div>
                    <div class="skill-item" data-aos="fade-right" data-aos-delay="400">
                        <div class="skill-name">JavaScript</div>
                        <div class="progress"><div class="progress-bar" data-width="90"></div></div>
                    </div>
                    <div class="skill-item" data-aos="fade-right" data-aos-delay="500">
                        <div class="skill-name">React</div>
                        <div class="progress"><div class="progress-bar" data-width="88"></div></div>
                    </div>
                    <div class="skill-item" data-aos="fade-right" data-aos-delay="600">
                        <div class="skill-name">Node.js</div>
                        <div class="progress"><div class="progress-bar" data-width="82"></div></div>
                    </div>
                    <div class="skill-item" data-aos="fade-right" data-aos-delay="700">
                        <div class="skill-name">Next.js</div>
                        <div class="progress"><div class="progress-bar" data-width="85"></div></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Professional Skills -->
        <section class="mt-5" data-aos="fade-up" data-aos-delay="900">
            <h2 class="section-title">Professional Skills</h2>
            <ul class="professional-skills">
                <li data-aos="zoom-in" data-aos-delay="1000">Problem Solving</li>
                <li data-aos="zoom-in" data-aos-delay="1100">Team Collaboration</li>
                <li data-aos="zoom-in" data-aos-delay="1200">Project Management</li>
                <li data-aos="zoom-in" data-aos-delay="1300">Communication</li>
                <li data-aos="zoom-in" data-aos-delay="1400">Adaptability</li>
                <li data-aos="zoom-in" data-aos-delay="1500">Time Management</li>
            </ul>
        </section>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

    <script>
        // Initialize AOS
        AOS.init({ duration: 1000, once: true });

        // Dark Mode Toggle
        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;
        const moonIcon = '<i class="fas fa-moon"></i>';
        const sunIcon = '<i class="fas fa-sun"></i>';

        // Load saved theme
        if (localStorage.getItem('theme') === 'dark' || 
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            body.setAttribute('data-theme', 'dark');
            themeToggle.innerHTML = sunIcon;
        } else {
            themeToggle.innerHTML = moonIcon;
        }

        themeToggle.addEventListener('click', () => {
            if (body.getAttribute('data-theme') === 'dark') {
                body.setAttribute('data-theme', 'light');
                themeToggle.innerHTML = moonIcon;
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                themeToggle.innerHTML = sunIcon;
                localStorage.setItem('theme', 'dark');
            }
        });

        // Progress bar animation on scroll
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const bar = entry.target.querySelector('.progress-bar');
                    const width = bar.getAttribute('data-width');
                    setTimeout(() => bar.style.width = width + '%', 300);
                }
            });
        }, { threshold: 0.6 });

        document.querySelectorAll('.skill-item').forEach(item => observer.observe(item));

        // Smooth scroll for nav links
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function(e) {
                if (this.getAttribute('href').startsWith('#')) {
                    e.preventDefault();
                    const target = document.querySelector(this.getAttribute('href'));
                    if (target) {
                        window.scrollTo({
                            top: target.offsetTop - 100,
                            behavior: 'smooth'
                        });
                    }
                }
            });
        });
    </script>
</body>
</html>
