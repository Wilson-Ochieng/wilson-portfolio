<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILLS</title>
</head>
<body>
    <style>
        body{
            font-family:system-ui,Segoe UI,Roboto,Arial;
            max-width:720px;
            margin:32px auto;
            padding:16px;
            line-height:1.6;
            background: linear-gradient(to right, #e0f7fa, #ffffff);
        }
        .professional-skills{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
            padding:0;
            margin:0;
            list-style:none;
        }
        .professional-skills li{
            background:#0ea5a4;
            color:#fff;
            padding:8px 12px;
            border-radius:999px;
            font-weight:600;
            box-shadow:0 2px 6px rgba(14,165,164,0.15);
            transition:transform .12s ease, box-shadow .12s ease;
        }
        .professional-skills li:hover{
            transform:translateY(-4px);
            box-shadow:0 6px 18px rgba(14,165,164,0.18);
        }
        </style>
    <h1>Skills Review</h1>
    <section>
        <h2>Technical Skills</h2>
        <ul>
            <li>HTML & CSS</li>
            <li>JavaScript</li>
            <li>React</li>
            <li>Node.js</li>
            <li>Next.js</li>
        </ul>
    </section>
    <section>
        <h2>Professional Skills</h2>
        
        <ul class="professional-skills">
            <li>Problem Solving</li>
            <li>Team Collaboration</li>
            <li>Project Management</li>
            <li>Communication</li>
        </ul>
    </section>
</body>
</html>
