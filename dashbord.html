<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f5f6fa;
    }
    .sidebar {
      height: 100vh;
      background: #343a40;
      padding-top: 20px;
    }
    .sidebar a {
      color: #ddd;
      padding: 15px;
      display: block;
      text-decoration: none;
      transition: 0.3s;
    }
    .sidebar a:hover {
      background: #495057;
      color: #fff;
    }
    .content {
      padding: 20px;
    }
    .card {
      border-radius: 15px;
    }
  </style>
</head>

<body>

<div class="container-fluid">
  <div class="row">

    <!-- Sidebar -->
    <div class="col-md-3 col-lg-2 sidebar">
      <h4 class="text-white text-center mb-4">Dashboard</h4>

      <a href="#">🏠 Dashboard
        
      </a>
  
      
      
      
    </div>

    <!-- Content -->
    <div class="col-md-9 col-lg-10 content">

      <h2 class="mb-4">Welcome Back!</h2>

      <div class="row g-4">

        <div class="col-md-4">
          <div class="card p-3 shadow-sm">
            <h5>Total Users</h5>
            <h3>120</h3>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card p-3 shadow-sm">
            <h5>Active Projects</h5>
            <h3>8</h3>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card p-3 shadow-sm">
            <h5>Pending Tasks</h5>
            <h3>14</h3>
          </div>
        </div>

      </div>

      <div class="card mt-4 p-4 shadow-sm">
        <h4>Recent Activity</h4>
        <ul>
          <li>New user added</li>
          <li>Project hardware updated</li>
          <li>Inventory item restocked</li>
        </ul>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
