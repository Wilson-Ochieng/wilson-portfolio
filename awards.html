<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Award Certificate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 40px;
    }

    .certificate {
      width: 700px;
      margin: auto;
      padding: 40px;
      background: white;
      border: 5px solid #c7aa50;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h1 {
      font-size: 40px;
      color: #c7aa50;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      margin: 10px 0;
    }

    .footer {
      margin-top: 40px;
      display: flex;
      justify-content: space-between;
      padding: 0 40px;
      font-size: 16px;
    }
  </style>
</head>

<body>
  <div class="certificate">
    <h1>Certificate of Award</h1>
    <h2>Presented To</h2>

    <p><strong>Your Name Here</strong></p>

    <p>For outstanding performance and dedication.</p>

    <div class="footer">
      <p>_________________<br>Signature</p>
      <p>_________________<br>Date</p>
    </div>
  </div>
</body>
</html>
